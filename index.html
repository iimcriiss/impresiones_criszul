<p class="neg" id="neg"></p>
<h1>Envía tus archivos para imprimir</h1>
<p class="sub">Solo los ve quien atiende el negocio.</p>
<form id="f" class="card" novalidate>
<label for="n">Tu nombre</label><input id="n" maxlength="60" autocomplete="name">
<label for="o">¿Qué necesitas? <small>(copias, tamaño, color o blanco y negro)</small></label><textarea id="o" rows="3" maxlength="300"></textarea>
<label for="file">Archivos <small>(fotos, PDF, Word o Excel · hasta 50 MB y 10 archivos)</small></label>
<label id="drop" for="file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><b>Toca para elegir archivos</b>o arrástralos aquí</label>
<input id="file" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,.heif,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,image/*">
<ul id="ls"></ul><div id="ts"></div><p id="msg" role="alert"></p>
<button class="btn" id="go">Enviar</button>
</form>
<div class="card exito" id="exito" hidden><h2>¡Recibimos tus archivos!</h2><p>Tu código es</p><p class="cod" id="cod"></p><p>Si vas a preguntar por tu pedido, di este código.</p><button class="mini" id="copiar" type="button">Copiar código</button></div>
<p class="rec"><a href="recoger.html">¿Ya te avisaron? Recoger mi pedido →</a></p>
</main><script src="/assets/js/comun.js"></script><script src="/assets/js/enviar.js"></script></body></html>
