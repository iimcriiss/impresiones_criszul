<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Archivos recibidos</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/iconos/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/iconos/favicon-16x16.png">
<link rel="apple-touch-icon" href="/iconos/apple-icon-180x180.png">
<link rel="stylesheet" href="/fondo.css">
<style>
:root{--ink:#101820;--mut:#5b6670;--line:#d9dee3;--c:#00a3d9}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#f2f4f6}
main{max-width:760px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:1.5rem;letter-spacing:-.01em;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
button{font:inherit;padding:8px 12px;border:1px solid #b8c0c7;border-radius:4px;background:#fff;color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--c);outline-offset:2px}
input{font:inherit;padding:11px;border:1px solid #b8c0c7;border-radius:4px;width:100%;margin-bottom:10px}
.ped{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
.ped header{display:flex;justify-content:space-between;align-items:baseline;color:var(--mut);gap:8px}
.ped header b{color:var(--ink);font-size:1.4rem;letter-spacing:.12em}
.ped p{margin:6px 0}.nota{background:#fff8d6;border-radius:4px;padding:8px 10px;white-space:pre-wrap}
ul{list-style:none;padding:0;margin:8px 0}
li{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
li span{flex:1;min-width:0;overflow-wrap:anywhere}li em{font-style:normal;color:var(--mut);font-size:.85rem;white-space:nowrap}
.acc{display:flex;gap:8px}.del{color:#b00020;margin-left:auto}
#err{color:#b00020;min-height:1.5em}.vacio{text-align:center;color:var(--mut);padding:36px 0}
[hidden]{display:none!important}
</style></head><body><main>
<form id="login"><h1>Archivos recibidos</h1><input id="clave" type="password" placeholder="Clave" autocomplete="current-password" required><button>Entrar</button><p id="err"></p></form>
<section id="panel" hidden><h1>Archivos recibidos <span><button id="act">Actualizar</button> <button id="sal">Salir</button></span></h1><div id="lista"></div></section>
</main><script src="panel.js"></script></body></html>
